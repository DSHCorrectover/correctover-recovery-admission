name: release

# Publish one registry at a time. Tags:
#   pypi-v0.1.4  -> build wheel/sdist, smoke it, publish to PyPI (trusted publishing)
#   npm-v0.1.2   -> smoke package.json, publish to npm
# Tag must equal the version in that registry's manifest.
# workflow_dispatch = dry run: build + selfcheck only, never publishes.

on:
  push:
    tags: ["pypi-v*", "npm-v*"]
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  pypi:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/pypi-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Version parity (tag vs pyproject) — skipped on dry run
        if: ${{ github.event_name == 'push' }}
        run: |
          PYV=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "${GITHUB_REF_NAME#pypi-v}" = "$PYV" ] || { echo "::error::tag ${GITHUB_REF_NAME} != pyproject $PYV"; exit 1; }
      - run: pip install build && python -m build
      - name: Smoke — wheel selfchecks 576/576
        run: pip install dist/*.whl && python -m recovery_admission
      - name: Publish to PyPI
        if: ${{ github.event_name == 'push' }}
        uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/npm-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", registry-url: "https://registry.npmjs.org" }
      - name: Version parity (tag vs package.json) — skipped on dry run
        if: ${{ github.event_name == 'push' }}
        run: |
          NPV=$(node -p "require('./package.json').version")
          [ "${GITHUB_REF_NAME#npm-v}" = "$NPV" ] || { echo "::error::tag ${GITHUB_REF_NAME} != package.json $NPV"; exit 1; }
      - name: Smoke — npm pack artifact runs selfcheck
        run: |
          npm pack
          npm i -g ./recovery-admission-*.tgz
          recovery-admission --selfcheck
      - name: Publish to npm
        if: ${{ github.event_name == 'push' }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
